spring.application.name=tripSync

# MySQL connection properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tripsync}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT: the secret must come from the environment (at least 32 bytes); there is no default
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origins=http://localhost:5173

# Error responses: never include stack traces or exception class names (also overrides devtools)
server.error.include-stacktrace=never
server.error.include-exception=false
