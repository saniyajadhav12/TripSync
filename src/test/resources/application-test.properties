# In-memory H2 database for tests (no MySQL needed)
spring.datasource.url=jdbc:h2:mem:tripsync;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# TEST-ONLY JWT secret. Not a real secret; never use it outside tests.
app.jwt.secret=test-only-jwt-secret-do-not-use-in-production-0123456789
